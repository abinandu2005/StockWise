server.port=8086

spring.application.name=analytics-reports-service

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/StockFlow}

# Serialize LocalDateTime as ISO-8601 strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# JWT
jwt.secret=${JWT_SECRET:ThisIsAVeryStrongSecretKeyForStockWiseJWTAuthentication2024!@#}

# SpringDoc
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.stockwise.analytics=DEBUG
