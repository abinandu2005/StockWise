server.port=8085

spring.application.name=sales-dispatch-service

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/StockFlow}

# Feign Client Downstream URLs
inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

# JWT
jwt.secret=${JWT_SECRET:ThisIsAVeryStrongSecretKeyForStockWiseJWTAuthentication2024!@#}

# SpringDoc
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.stockwise.salesdispatch=DEBUG
