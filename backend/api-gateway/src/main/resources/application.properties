server.port=9090

spring.application.name=api-gateway

# Gateway Discovery Locator (Disabled since Eureka is removed)
spring.cloud.gateway.discovery.locator.enabled=false

# Routes - Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter

# Routes - Inventory Service
spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=${INVENTORY_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**, /api/inventory/**, /api/warehouses/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# Routes - Purchase Order Service
spring.cloud.gateway.routes[2].id=purchase-order-service
spring.cloud.gateway.routes[2].uri=${PURCHASE_ORDER_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/purchase-orders/**, /api/goods-receipt/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# Routes - Sales & Dispatch Service
spring.cloud.gateway.routes[3].id=sales-dispatch-service
spring.cloud.gateway.routes[3].uri=${SALES_DISPATCH_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/sales-orders/**, /api/dispatch/**, /api/returns/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

# Routes - Supplier & Customer Service
spring.cloud.gateway.routes[4].id=supplier-customer-service
spring.cloud.gateway.routes[4].uri=${SUPPLIER_CUSTOMER_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/suppliers/**, /api/customers/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter

# Routes - Analytics & Reports Service
spring.cloud.gateway.routes[5].id=analytics-reports-service
spring.cloud.gateway.routes[5].uri=${ANALYTICS_REPORTS_SERVICE_URI:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/analytics/**, /api/reports/**, /api/notifications/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthenticationFilter

# Swagger API Docs Routing
spring.cloud.gateway.routes[6].id=auth-service-docs
spring.cloud.gateway.routes[6].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/v3/api-docs/auth, /v3/api-docs

spring.cloud.gateway.routes[7].id=inventory-service-docs
spring.cloud.gateway.routes[7].uri=${INVENTORY_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/inventory
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/v3/api-docs/inventory, /v3/api-docs

spring.cloud.gateway.routes[8].id=supplier-service-docs
spring.cloud.gateway.routes[8].uri=${SUPPLIER_CUSTOMER_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/suppliers
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/suppliers, /v3/api-docs

spring.cloud.gateway.routes[9].id=purchase-order-service-docs
spring.cloud.gateway.routes[9].uri=${PURCHASE_ORDER_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/purchase-orders
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/purchase-orders, /v3/api-docs

spring.cloud.gateway.routes[10].id=sales-service-docs
spring.cloud.gateway.routes[10].uri=${SALES_DISPATCH_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/sales
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/sales, /v3/api-docs

spring.cloud.gateway.routes[11].id=analytics-service-docs
spring.cloud.gateway.routes[11].uri=${ANALYTICS_REPORTS_SERVICE_URI:http://localhost:8086}
spring.cloud.gateway.routes[11].predicates[0]=Path=/v3/api-docs/analytics
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/v3/api-docs/analytics, /v3/api-docs

# Global CORS
# Explicitly list allowed origins so browsers accept responses that
# include Authorization / X-User-* request headers. Wildcards (*) are
# rejected by browsers when custom request headers are present.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Deduplicate CORS headers to prevent duplicate header values when downstream microservices also configure CORS.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST


# JWT
jwt.secret=${JWT_SECRET:ThisIsAVeryStrongSecretKeyForStockWiseJWTAuthentication2024!@#}

# SpringDoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth
springdoc.swagger-ui.urls[1].name=Inventory Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/inventory
springdoc.swagger-ui.urls[2].name=Purchase Order Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/purchase-orders
springdoc.swagger-ui.urls[3].name=Sales & Dispatch Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/sales
springdoc.swagger-ui.urls[4].name=Supplier & Customer Service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/suppliers
springdoc.swagger-ui.urls[5].name=Analytics & Reports Service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/analytics

# Actuator
management.endpoints.web.exposure.include=health,info,gateway

# Logging
logging.level.com.stockwise.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
