server.port=8081

spring.application.name=auth-service

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockwise_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${MYSQL_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:admin}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# JWT
jwt.secret=${JWT_SECRET:ThisIsAVeryStrongSecretKeyForStockWiseJWTAuthentication2024!@#}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-days=7

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.stockwise.auth=DEBUG
logging.level.org.springframework.security=INFO

# Mail configuration (Gmail SMTP with App Password)
spring.mail.host=smtp.gmail.com
